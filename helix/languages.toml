[language-server.tailwindcss-ls]
command = "tailwindcss-language-server"
args = ["--stdio"]

[[language]]
name = "css"
language-servers = [ "vscode-css-language-server", "tailwindcss-ls" ]

[[language]]
name = "jsx"
language-servers = [ "typescript-language-server", "tailwindcss-ls" ]

[[language]]
name = "tsx"
language-servers = [ "typescript-language-server", "tailwindcss-ls" ]

[language-server.emmet-lsp]
command = "emmet-language-server"
args = ["--stdio"]

[[language]]
name = "tsx"
formatter = { command = "prettier", args = ["--parser", "typescript"] }
language-servers = ["typescript-language-server", "emmet-lsp"]

# https://github.com/olrtg/emmet-language-server?tab=readme-ov-file#helix
[[language]]
name = "html"
roots = [".git"]
formatter = { command = "prettier", args = ["--parser", "html", "--tab-width", "4"] }
language-servers = ["vscode-html-language-server", "emmet-lsp"]

[[language]]
name = "go"
roots = ["go.work", "go.mod"]
auto-format = true
formatter = { command = "gofmt" }

[language-server.golangci-lint-lsp]
command = "golangci-lint-langserver"

