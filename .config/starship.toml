format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$fill\
$aws\
$nodejs\
$python\
$dotnet\
$cmd_duration $jobs $time\
$line_break\
$character"""

#format = "$all"

[nodejs]
format = "[$symbol($version )]($style)"

[fill]
symbol = " "

# Replace the '❯' symbol in the prompt with '➜' or 'λ'

[directory]
style = "blue"
truncation_length = 15
truncation_symbol = ".../"
truncate_to_repo = true

[character]
success_symbol = "[λ](purple)"
error_symbol = "[λ](red)"
vicmd_symbol = "[λ](green)"

[git_branch]
symbol = "⎇ "
format = "[$symbol$branch]($style) "
style = "bright-black"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "cyan"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[git_metrics]
disabled = false

[cmd_duration]
format = "[$duration]($style)"
style = "yellow"

[time]
disabled = false
style = "bold white"
format = "[$time]($style)"

[custom.stunnel]
when = "ps aux | grep stunnel | grep -v grep"
command = "ps -o etime= -p $(ps aux | grep stunnel | grep -v grep | awk '{print $2}')"
style = "red"
format = "[TUNNEL OPEN for $output]($style)"